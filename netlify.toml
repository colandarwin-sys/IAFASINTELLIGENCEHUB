[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/users?route=health"
  status = 200
  force = true

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/users?route=login"
  status = 200
  force = true

[[redirects]]
  from = "/api/users"
  to = "/.netlify/functions/users?route=users"
  status = 200
  force = true

[[redirects]]
  from = "/api/users/*"
  to = "/.netlify/functions/users?route=users/:splat"
  status = 200
  force = true

[[headers]]
  for = "/LISTAS-AB-ACTUALIZADO.xlsx"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/static/listas-ab-data.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
